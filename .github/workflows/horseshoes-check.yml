name: Horseshoes source checks
on:
  pull_request:
    paths:
      - 'src/horseshoes/**'
      - 'horseshoes.html'
      - 'package*.json'
      - 'vite.config.js'
      - '.github/workflows/horseshoes-check.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
